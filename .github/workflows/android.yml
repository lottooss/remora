name: android

on:
  push:
    branches: [main, develop]
    paths: ['apps/android/**', 'conformance/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['apps/android/**', 'conformance/**', '.github/workflows/android.yml']

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: assembleDebug + unit tests (incl. conformance vectors)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug testDebugUnitTest --console=plain
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: apps/android/**/build/reports/tests/
