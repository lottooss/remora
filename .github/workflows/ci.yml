name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript (typecheck, lint, unit, relay in workerd, conformance)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm run conformance:check
      - run: pnpm -F @remora/relay run deploy:check
      - name: Task packets parse and form a DAG
        run: node scripts/sync-issues.mjs --dry-run --repo "${{ github.repository }}"

  conformance-strict:
    # Non-required until wave 4 (P7-V3 removes continue-on-error): strict mode fails
    # while placeholder vectors remain (docs/tasks/P7-G2.md).
    name: Conformance (strict, non-required until P7-V3)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: pnpm run conformance:check -- --strict

  no-stubs:
    # Non-required until wave 4 (P7-V3 removes continue-on-error): the scan fails on
    # real stubs in production code that later packets must fix (docs/tasks/P7-G3.md).
    name: No-stubs (non-required until P7-V3)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: pnpm run check:no-stubs
